<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page Not Found | Attract · Align · Empower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, #f3eeff 0%, #faf8f5 100%);
      padding: 2rem;
    }
    .not-found-inner {
      max-width: 540px;
    }
    .not-found-number {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 15vw, 10rem);
      color: var(--color-secondary);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .not-found-inner h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      color: var(--color-primary);
      margin-bottom: 1rem;
    }
    .not-found-inner p {
      color: var(--color-muted);
      margin-bottom: 2rem;
      font-size: 1rem;
      line-height: 1.7;
    }
    .not-found-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="not-found">
    <div class="not-found-inner">
      <div class="not-found-number">404</div>
      <h1>Lost in the silence?</h1>
      <p>It seems this page has wandered off on its own journey. Let's get you back to somewhere familiar.</p>
      <div class="not-found-actions">
        <a href="index.html" class="btn btn-primary">Go Home</a>
        <a href="contact.html" class="btn btn-outline">Get in Touch</a>
      </div>
    </div>
  </div>
</body>
</html>
